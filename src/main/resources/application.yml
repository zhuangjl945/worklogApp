server:
  port: 8080
  # 经 Nginx 等反向代理时必须为 framework：否则 request.getRemoteAddr() 拿到的永远是代理机 IP，
  # 手机端登记接口的「按来源 IP 限流」会退化成全站全局限流（互相踩脚）。
  # 代价：开启后 X-Forwarded-For 会被信任，因此后端只能监听 127.0.0.1 由 Nginx 统一对外，
  # 否则客户端可自带头部伪造来源 IP 绕过限流。
  forward-headers-strategy: framework

# 生产环境：应用与 MySQL 在同一台机器时请写 127.0.0.1。
# 不要用本机的公网 IP 回连，云安全组常会丢弃这种绕行流量，表现为 Hikari 一直停在 Starting。
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/work_log_system?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8&connectTimeout=5000&socketTimeout=30000
    username: ${MYSQL_PROD_USER:}
    password: ${MYSQL_PROD_PASS:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 8000
      maximum-pool-size: 10

  servlet:
    multipart:
      # 手机端拍照登记的服务端兜底上传限制（主路径仍是 OSS 直传）。
      # Spring Boot 默认 1MB，手机原图普遍 5MB 以上，不调大必然 413。
      max-file-size: 5MB
      max-request-size: 30MB

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

# JWT：密钥不合格会让应用直接启动失败（见 JwtProps#afterPropertiesSet），这是有意设计。
# 生成长随机密钥（任选一种）：
#   PowerShell : -join ((48..57)+(97..122) | Get-Random -Count 48 | ForEach-Object {[char]$_})
#   Linux/macOS: openssl rand -base64 48
jwt:
  secret: ${JWT_SECRET:}
  # 12 小时偏长，收窄到 8 小时（一个工作日）；过期后前端会收到 401 并跳回登录页
  expire-seconds: 28800

# 跨域来源，逗号分隔；留空表示只允许同源部署（当前生产形态：前端 dist 与后端同域）。
# 仅当手机端 H5 或管理端被部署到另一个域名时才需要配置，例如 https://work.example.com
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

aliyun:
  oss:
    endpoint: oss-cn-hangzhou.aliyuncs.com
    bucket: worklog-oss
    access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
    dir-prefix: work-records/
