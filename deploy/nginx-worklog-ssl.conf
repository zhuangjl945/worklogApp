# ============================================================================
# worklog nginx HTTPS 版
# 相对 80 端口版只动四处：
#   A) 80 的 server 退化成只做跳转
#   B) 新增 443 的 server，证书挂这里
#   C) TLS 参数提到 http 块（会话复用，手机端少一次握手）
#   D) /api/ 前加 ^~，避免被敏感文件正则吃掉
#
# 上线前确认三件事：
#   1) 证书 SAN 里的域名要和 server_name 一致。
#      当前若是「用 IP 直接访问」，浏览器必然报证书不匹配：
#      要么补一张带该 IP SAN 的证书，要么内网起域名再签。
#   2) ssl_certificate 必须是「服务器证书 + 中间 CA」完整链。
#      本项目有手机扫码场景，Android 不会自动补链，
#      PC 能打开不代表手机能打开，链不全就是手机打不开登记页。
#   3) 私钥要无口令，否则 reload 会卡在输入密码。
#      去口令：openssl rsa -in encrypted.key -out plain.key
# ============================================================================

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile           on;
    keepalive_timeout  65;

    # ------------------------------------------------------------ TLS 全局
    # 等保 2.0 报的「TLS1.0/1.1 弱加密」基本都是这里没收窄。
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    # 只留 AEAD 套件；老旧终端连不上时先查协议而不是这里。
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

    # 会话复用，内网 wifi 上手机首屏差别明显。
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 这里「故意没开」ssl_stapling。
    # 内网 CA / 自签证书的 OCSP 地址公网不可达，开了反而拖慢握手。
    # 只有公网可信 CA 且机器能出网时才考虑：
    #   ssl_stapling on; ssl_stapling_verify on; resolver 223.5.5.5 valid=300s;

    # ================================================================= 80
    # 只负责跳转。旧二维码里印的是 http:// 地址，靠这条 301 兜住，
    # 换证书不用重贴工位上那张码。
    server {
        listen       80;
        server_name  _;

        # certbot / acme.sh 用 webroot 续期时保留，纯买证书可删。
        location ^~ /.well-known/acme-challenge/ {
            root /usr/local/nginx/html;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ================================================================ 443
    server {
        listen       443 ssl;
        # 改成证书 SAN 里的域名。留 _ 的话 SNI 匹配不上，
        # 多张证书共存时容易命中错的那一张。
        server_name  worklog.example.gov.cn;

        # ---- 证书（一般只改这两行路径） ----
        # 阿里云/腾讯云下载的 Nginx 格式：xxx.pem 已含完整链，直接填它。
        # Let's Encrypt：填 fullchain.pem，不要填 cert.pem。
        ssl_certificate     /usr/local/nginx/ssl/worklog.pem;
        ssl_certificate_key /usr/local/nginx/ssl/worklog.key;

        # HTTP/2。nginx >= 1.25.1 用这行；
        # 更老版本会报 unknown directive "http2"，
        # 删掉本行并改成 listen 443 ssl http2;
        http2 on;

        # HSTS 下发后浏览器会在有效期内强制 HTTPS，回退成本高。
        # 确认 443 稳定跑一段时间后再放开：
        # add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

        client_max_body_size 30m;
        proxy_headers_hash_max_size 1024;
        proxy_headers_hash_bucket_size 128;

        root   /usr/local/nginx/html;
        index  index.html;
        access_log /usr/local/nginx/worklog.access.log;
        error_log  /usr/local/nginx/worklog.error.log;

        # ------------------------------------------------ 屏蔽敏感文件探测
        location ~* \.(env|bak|old|save|yml|yaml|properties|ini|sql|conf|pem|key|log)$ {
            return 404;
        }
        location ~* ^/(\.git|\.svn|\.DS_Store|actuator|wp-config|wp-admin|phpinfo|docker-compose|secrets|credentials|\.well-known/config) {
            return 404;
        }

        # 带 hash 的构建产物钉一年，必须写在 location / 之前。
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }
        location = /index.html {
            add_header Cache-Control "no-store";
        }
        # SPA 路由刷新 404
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-store";
        }

        # ---- ^~：命中前缀即停止正则匹配 ----
        # 上面两条正则按后缀收尾，而 nginx 里正则优先于普通前缀 location。
        # 不加 ^~，/api/xx/download.yml 这类接口会被 404 拦在 nginx 层，
        # 后端毫无日志，极易误判成应用故障。
        location ^~ /api/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            # $scheme 在这个 server 里就是 https，
            # 后端 forward-headers-strategy: framework 据此还原正确的绝对 URL。
            proxy_set_header X-Forwarded-Proto $scheme;

            # 后续用到 WebSocket / SSE 时再打开：
            # proxy_set_header Upgrade    $http_upgrade;
            # proxy_set_header Connection $connection_upgrade;

            proxy_read_timeout 60s;
            proxy_connect_timeout 5s;
            # 大附件不在 nginx 落盘再转发，省一次磁盘 IO
            proxy_request_buffering off;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}