# ============================================================================
# 工作日志系统 · nginx 发布配置（前端产物由 nginx 直接发，后端只出接口）
#
# 用法：把本文件放到 /etc/nginx/conf.d/worklog.conf，改三处
#   1) server_name        —— 必须是「手机能访问到」的地址，二维码里的域名就是它
#   2) root               —— 指向前端构建产物目录（web/dist 发布过去的目标）
#   3) proxy_pass 的端口  —— 与 server.port 一致（本项目默认 8080）
# 然后 nginx -t && nginx -s reload
# ============================================================================

server {
    listen 80;
    server_name worklog.example.gov.cn;

    # 报修人上传的是压缩后现场照片，但直传 OSS 走的是 OSS 域名不过这里；
    # 留 30m 是为了与工作记录的附件上传、以及后端 multipart 上限保持一致，
    # 否则用户会在 nginx 层先收到一个没有任何业务提示的 413。
    client_max_body_size 30m;

    root  /srv/worklog/web;
    index index.html;

    access_log /var/log/nginx/worklog.access.log;
    error_log  /var/log/nginx/worklog.error.log;

    # ---------------------------------------------------------------- 静态资源
    # 带内容 hash 的构建产物可以钉死一年。必须写在 location / 之前，否则被兜底规则吃掉。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html 一律不缓存：一旦缓存住，前端发版后旧页面还在引用已被删除的 hash 资源，
    # 表现为「用户不刷新就打不开新页面」，而且这种故障在用户侧看不出原因。
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # ------------------------------------------------------------------ 后端口
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        # 手机端登记有按 IP 的限流（TicketRateLimiter）。不透传真实客户端 IP 的话，
        # 整个办公网/4G 出口 NAT 会共用一个地址，第 6 个报修人就开始被误伤。
        # 后端 application.yml 已开 forward-headers-strategy: framework，这里必须配套打开。
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
        # 大附件不先在 nginx 落盘再转发，白占一次磁盘 IO
        proxy_request_buffering off;
    }

    # ------------------------------------------------- SPA history 模式路由兜底
    # /m/AB12CD34EF、/m/ticket/ST20260909000001、/tickets/12 这些路径后端没有对应接口，
    # 必须回落到 index.html 交给 Vue Router；不含点号的路径才回落，避免把静态资源请求也吞了。
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }

    # ---------------------------------------------------------------- 不该外露
    # /error 与 actuator 一旦被扫出来就是信息泄露面；这里直接 404。
    location ~ ^/(error|actuator|manager|status)\b {
        return 404;
    }

    # 隐藏文件/目录（.git、.env 等）——发布目录里不该有，但兜一道
    location ~ /\. {
        deny all;
    }
}
